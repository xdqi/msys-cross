# makepkg config for cross-building msys2-cross packages with
#   HOST   = arm64 macOS 11.0   (binaries are arm64 Mach-O, run on Apple Silicon)
#   TARGET = i686-w64-mingw32   (selected per run via MSYS_CROSS_TARGET)
# on a Linux x86_64 BUILD machine, using zig cc as the cross compiler.
#
# Usage:
#   MSYS_CROSS_TARGET=mingw32 makepkg --config scripts/makepkg-darwin-arm64.conf \
#       --ignorearch --nocheck -fCd --skippgpcheck
#
#   --ignorearch : the PKGBUILDs declare arch=('x86_64'); we emit arm64.
#   --nocheck    : the dejagnu testsuite would try to RUN arm64 Mach-O on Linux.
#
# How it works: makepkg sources this file into its own process before build(), so
# exported vars/PATH propagate into build(). The wrappers (scripts/zigcc, zig-common.sh)
# read ZIG_TARGET; the PKGBUILDs / build_deps.sh read MSYS_CROSS_HOST/MSYS_CROSS_BUILD.
# Everything defaults to the normal Linux build when these are unset.

# Start from the system defaults, then override only what differs.
source /etc/makepkg.conf
# Per-target cross env (ZIG_TARGET=aarch64-macos.11.0, MSYS_CROSS_HOST,
# MSYS_CROSS_DUMPSPECS=1, the MSYS_CROSS_ENV_LOADED marker) — single source of truth,
# shared with build-darwin.sh. MSYS_CROSS_BUILD stays unset there -> host != build =>
# cross mode (configure won't RUN the arm64 conftest on the Linux build machine).
# makepkg sets ${BASH_SOURCE[0]} to this conf's path, so dirname resolves to scripts/.
source "$(dirname "${BASH_SOURCE[0]}")/env-darwin.sh"

# --- makepkg-only knobs below (NOT in env-darwin.sh) ---
# Package metadata arch + canonical host triple (matches Homebrew's macOS pacman:
# CARCH=arm64, CHOST=aarch64-apple-darwin*).
CARCH="arm64"
CHOST="aarch64-apple-darwin20"

# zlib comes from the arm64 static deps prefix (deps/install-$ZIG_TARGET, provisioned by
# build-deps-darwin.sh), so --with-system-zlib resolves normally — no workaround needed.

# Mach-O can't be stripped/objcopy'd the GNU way (and dsymutil-based dSYM separation
# is a later phase). Keep symbols embedded for now.
OPTIONS=(!strip docs libtool staticlibs emptydirs zipman purge !debug !lto !autodeps)
STRIP_BINARIES=""
STRIP_SHARED=""
STRIP_STATIC=""

# zstd-compressed package, matching the M1 pacman's expectation.
PKGEXT='.pkg.tar.zst'
SRCEXT='.src.tar.gz'
