# makepkg config for cross-building msys2-cross packages with
#   HOST   = arm64 macOS 11.0   (binaries are arm64 Mach-O, run on Apple Silicon)
#   TARGET = i686-w64-mingw32   (selected per run via _MSYS_CROSS_TARGET)
# on a Linux x86_64 BUILD machine, using zig cc as the cross compiler.
#
# Usage:
#   _MSYS_CROSS_TARGET=mingw32 makepkg --config scripts/makepkg-darwin-arm64.conf \
#       --ignorearch --nocheck -fCd --skippgpcheck
#
#   --ignorearch : the PKGBUILDs declare arch=('x86_64'); we emit arm64.
#   --nocheck    : the dejagnu testsuite would try to RUN arm64 Mach-O on Linux.
#
# How it works: makepkg sources this file into its own process before build(), so
# exported vars/PATH propagate into build(). The wrappers (scripts/zigcc, zig-common.sh)
# read ZIG_TARGET; the PKGBUILDs / build_deps.sh read _MSYS_CROSS_HOST/_MSYS_CROSS_BUILD.
# Everything defaults to the normal Linux build when these are unset.

# Start from the system defaults, then override only what differs.
source /etc/makepkg.conf

# Package metadata arch + canonical host triple (matches Homebrew's macOS pacman:
# CARCH=arm64, CHOST=aarch64-apple-darwin*).
CARCH="arm64"
CHOST="aarch64-apple-darwin20"

# Retarget the zig toolchain to macOS 11.0 arm64. zigcc/zigc++ pass this to
# `zig cc -target`, and zig_sccache_reexec folds <zigver>:<target> into
# SCCACHE_C_CUSTOM_CACHE_BUSTER so darwin keys never collide with the Linux cache.
export ZIG_TARGET="aarch64-macos.11.0"

# Force configure into cross mode (host != build) so it won't RUN the arm64 conftest
# on the Linux build machine. _MSYS_CROSS_BUILD stays unset -> build machine is Linux.
export _MSYS_CROSS_HOST="aarch64-apple-darwin20"

# zlib comes from the arm64 static deps prefix (deps/install-$ZIG_TARGET, built by
# build_deps.sh), so --with-system-zlib resolves normally — no workaround needed.

# GCC's `specs` pass runs the freshly built host xgcc (-dumpspecs), which can't execute
# on the Linux build machine (arm64 Mach-O). The dumped specs depend only on the TARGET,
# so the GCC PKGBUILD pre-seeds the file using a build-runnable, SAME-target gcc — the
# repo's own x86_64-linux-hosted msys-cross-<target>-gcc, selected per _MSYS_CROSS_TARGET.
# This is just the on/off switch; the PKGBUILD resolves the correct per-target helper.
export _MSYS_CROSS_DUMPSPECS=1

# Mach-O can't be stripped/objcopy'd the GNU way (and dsymutil-based dSYM separation
# is a later phase). Keep symbols embedded for now.
OPTIONS=(!strip docs libtool staticlibs emptydirs zipman purge !debug !lto !autodeps)
STRIP_BINARIES=""
STRIP_SHARED=""
STRIP_STATIC=""

# zstd-compressed package, matching the M1 pacman's expectation.
PKGEXT='.pkg.tar.zst'
SRCEXT='.src.tar.gz'
