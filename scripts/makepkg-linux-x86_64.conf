# makepkg config for the DEFAULT build: host = x86_64 Linux (glibc), the native case.
# Symmetric counterpart of makepkg-darwin-arm64.conf — pinning the same knobs to their
# Linux values so both targets are explicit and self-documenting (rather than relying
# on the bare /etc/makepkg.conf defaults + implicit env). Using this conf is OPTIONAL:
# every override below equals the built-in default, so a plain `makepkg` is identical.
#
# Usage:
#   _MSYS_CROSS_TARGET=mingw64 makepkg --config scripts/makepkg-linux-x86_64.conf -fCd --skippgpcheck

source /etc/makepkg.conf
# Per-target cross env (ZIG_TARGET, _MSYS_CROSS_HOST/_MSYS_CROSS_BUILD, the
# MSYS_CROSS_ENV_LOADED marker) — single source of truth, shared with build.sh.
# makepkg sets ${BASH_SOURCE[0]} to this conf's path, so dirname resolves to scripts/.
source "$(dirname "${BASH_SOURCE[0]}")/env-linux.sh"

# --- makepkg-only knobs below (NOT in env-linux.sh) ---
# Host arch + triple: the Linux build machine itself.
CARCH="x86_64"
CHOST="x86_64-linux-gnu"

# Linux host ELF binaries: GNU strip / split-debug work normally — keep the defaults
# (the inherited OPTIONS already has strip+debug behavior per PKGBUILD). PKGEXT also
# stays at the system default. Nothing else to override.
