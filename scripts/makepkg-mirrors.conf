# makepkg config snippet: route https:// downloads through dlagent-https.sh,
# which falls back to the kernel.org GNU mirror for ftp.gnu.org sources (gcc,
# binutils). Every other DLAGENTS entry stays as /etc/makepkg.conf set it.
#
# Sourced after /etc/makepkg.conf by makepkg-linux-x86_64.conf and
# makepkg-darwin-arm64.conf. A plain `makepkg` (the default linux pass, no
# --config) reads it from /etc/makepkg.conf.d/, where build.sh links it when it
# runs as root. readlink -f resolves that link back to this directory.
_msys_cross_dlagent="$(dirname "$(readlink -f "${BASH_SOURCE[0]}")")/dlagent-https.sh"
_msys_cross_agents=()
for _a in "${DLAGENTS[@]}"; do
    [[ $_a == https::* ]] && _a="https::$_msys_cross_dlagent %o %u"
    _msys_cross_agents+=("$_a")
done
DLAGENTS=("${_msys_cross_agents[@]}")
unset _a _msys_cross_agents _msys_cross_dlagent
