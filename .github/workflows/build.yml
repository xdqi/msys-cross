# Build the full msys2-cross toolchain repo on GitHub Actions.
#
# The build runs inside an Arch Linux container because scripts/build.sh drives
# the host package manager directly (`pacman -Syu`). Everything else — Zig, the
# MSYS2 sysroots, and the gmp/mpfr/mpc/isl/zlib/zstd source tarballs — is fetched
# inside the container, so the workflow is essentially `bash scripts/build.sh`.
#
# Output: the pacman repo under repo/ (toolchain packages + msys-cross.db +
# bootstrap.tar.xz), uploaded as build artifacts and, on push to main, published
# to a GitHub Release tagged YYYYMMDD.N — which is what the msys-mirror service
# serves (packages live as release assets, GitHub provides storage + CDN).
name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One in-flight build per ref; a newer push cancels the older run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Needed by the release step (gh release create/upload) on push to main.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux/archlinux:base-devel
      # base-devel image ships the makepkg toolchain; build.sh still runs
      # `pacman -Syu` and creates an unprivileged builduser, so it needs root
      # inside the container (the default for GHA service containers).
    timeout-minutes: 180

    steps:
      # actions/checkout shells out to git; the minimal Arch image ships neither
      # git nor the node the action needs. github-cli (gh) is for the release
      # step — the whole job runs in this container, so gh must live here too.
      - name: Install prerequisites
        run: pacman -Sy --noconfirm --needed git nodejs github-cli

      - name: Checkout (with MSYS2-packages submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The repo is checked out as root but git refuses to operate on a tree owned
      # by another uid once builduser is involved; mark it safe pre-emptively.
      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # build.sh frees each package's scratch BUILDDIR right after that package
      # is built, so peak disk is ~one toolchain build tree at a time rather than
      # all of them — no host-level disk reclaim (maximize-build-space / LVM) is
      # needed, and none would work inside this container job anyway.
      - name: Build toolchain repo
        run: bash scripts/build.sh

      - name: Summarize repo
        run: |
          echo "=== Packages ==="
          ls -lh repo/*.pkg.tar.* 2>/dev/null || true
          echo "=== Database ==="
          ls -lh repo/msys-cross.db* repo/msys-cross.files* 2>/dev/null || true
          echo "=== Bootstrap ==="
          ls -lh repo/bootstrap.tar.xz 2>/dev/null || true

      # Build artifacts (kept for PRs and as a fallback to the release). The
      # gcc/binutils packages are now stripped with split debug symbols, so the
      # main packages are small and a separate *-debug package carries symbols.
      - name: Upload pacman repo
        uses: actions/upload-artifact@v4
        with:
          name: msys-cross-repo
          path: |
            repo/*.pkg.tar.*
            repo/msys-cross.db*
            repo/msys-cross.files*
          if-no-files-found: error
          retention-days: 14

      - name: Upload bootstrap tarball
        uses: actions/upload-artifact@v4
        with:
          name: msys-cross-bootstrap
          path: repo/bootstrap.tar.xz
          if-no-files-found: error
          retention-days: 14

      # Publish to a GitHub Release on push to main. The release assets are what
      # the msys-mirror service serves (it 302-redirects pacman to them). The tag
      # is build-YYYYMMDD.N (N = next sequence for today): the "build-" prefix keeps
      # these out of any semantic-version tag space, and each tag is an immutable
      # snapshot reachable at /archive/build-YYYYMMDD.N/, newest served at /repo/.
      #
      # No trigger loop: this workflow only fires on push to the main branch and on
      # PRs — NOT on `push: tags:` — so creating the release tag does not re-run it.
      - name: Publish release
        if: github.event_name == 'push'
        env:
          # gh authenticates with this; GH_REPO pins the repo so gh doesn't have to
          # infer it from git remotes (the checkout is owned by another uid here).
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          date_tag="$(date -u +%Y%m%d)"
          # Count existing build- releases for today to pick the next .N.
          n="$(gh release list --limit 200 --json tagName \
                 --jq "[.[] | select(.tagName | startswith(\"build-${date_tag}.\"))] | length" \
               2>/dev/null || echo 0)"
          tag="build-${date_tag}.$((n + 1))"
          echo "Release tag: $tag"

          # Assets: the pacman repo (packages + db/files) and the bootstrap tarball.
          # repo-add wrote msys-cross.db/.files as symlinks; upload the real
          # .tar.gz only (the mirror aliases the short names).
          assets=()
          for f in repo/*.pkg.tar.* repo/msys-cross.db.tar.gz repo/msys-cross.files.tar.gz repo/bootstrap.tar.xz; do
            [ -f "$f" ] && assets+=("$f")
          done
          echo "Uploading ${#assets[@]} assets"

          gh release create "$tag" "${assets[@]}" \
            --title "$tag" \
            --notes "Automated build from ${GITHUB_SHA}. Consumed by msys-mirror; pin via /archive/${tag}/." \
            --target "${GITHUB_SHA}"
