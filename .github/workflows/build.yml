# Build the full msys2-cross toolchain repo on GitHub Actions — PARALLEL topology.
#
# Steps 0-3 (host tools, zig, MSYS2 sysroots + wine helpers, BOTH hosts' static deps) are
# baked ONCE into a prep container image (build-prep-image job → ghcr). Then 10 cells run in
# parallel, each `container:` that image: per host (linux x86_64, darwin arm64-macOS) a
# [binutils→gcc] chain for each of mingw64/mingw32/ucrt64/cygwin plus a clang cell. gcc-<t>
# needs only binutils-<t>, so each chain is self-contained in one cell — no cross-cell deps,
# no artifact-of-binutils. Each cell uploads its *.pkg.tar.* as an artifact. Two collect jobs
# (one per host) download all of that host's cell artifacts into PKGDEST, run Step 5-6
# (repo-add + installer), and publish the GitHub Release — a single fan-in point per tag, so
# no multi-writer race. Compiler cache is the shared external SeaweedFS S3 bucket (sccache),
# so all cells/runs share one hot cache.
name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write   # push the prep image to ghcr

env:
  PREP_IMAGE: ghcr.io/${{ github.repository_owner }}/msys2-cross-prep

jobs:
  # ---------------------------------------------------------------------------
  # Prep image: Steps 0-3 for BOTH hosts, baked into one image and pushed to ghcr.
  # buildx layer cache (type=gha) makes an unchanged rebuild near-instant; a change to
  # build_deps.sh / sysroot scripts only re-runs the affected layer.
  # ---------------------------------------------------------------------------
  build-prep-image:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # Tag the prep image by a hash of ONLY the inputs that affect prep (Dockerfile +
      # prepare/deps scripts + the MSYS2-packages submodule commit that pins gcc/binutils
      # versions). Two commits with identical prep inputs → identical tag → the image is
      # reused as-is (the build step below detects it already exists on ghcr and skips the
      # rebuild/push). Only a real prep change produces a new tag.
      - name: Compute image tag (content hash of prep inputs)
        id: meta
        run: |
          sub="$(git -C deps/MSYS2-packages rev-parse HEAD 2>/dev/null || echo nosub)"
          h="$( { sha256sum Dockerfile.prep \
                            scripts/prepare-zig.sh \
                            scripts/prepare-build-sysroot.sh \
                            scripts/build_deps.sh \
                            scripts/build-deps-darwin.sh \
                            scripts/patch_zig_libcxx_oldglibc.sh \
                            scripts/zig-common.sh \
                            scripts/msys-cross-common.sh 2>/dev/null
                  echo "$sub"; } | sha256sum | cut -c1-16 )"
          tag="prep-${h}"
          echo "image=${PREP_IMAGE}:${tag}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Prep image tag: ${tag}"

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Reuse: if an image with this content-hash tag already exists on ghcr, skip the build.
      - name: Check if prep image already exists
        id: exists
        run: |
          if docker manifest inspect "${{ steps.meta.outputs.image }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Prep image already exists — skipping rebuild."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Prep image not found — will build."
          fi

      - name: Set up Docker Buildx
        if: steps.exists.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3

      # Build + push the prep image (only when not already present). The Dockerfile builds the
      # linux deps from source (the heavy bit) and fetches darwin bottles; buildx gha cache
      # keeps even a rebuild fast. sccache is NOT used here — prep compiles only the small
      # static deps via zig directly.
      - name: Build and push prep image
        if: steps.exists.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prep
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Build cells: 2 hosts × {4 chains + clang} = 10 cells, all from the prep image.
  # ---------------------------------------------------------------------------
  cell:
    needs: build-prep-image
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: ${{ needs.build-prep-image.outputs.image }}
    strategy:
      fail-fast: false
      matrix:
        host: [linux, darwin]
        phase: [others, chain:mingw64, chain:mingw32, chain:ucrt64, chain:cygwin, clang]
        # 2 hosts × 6 phases = 12 cells. `others` builds the foundation packages
        # (filesystem/ca-certificates/pacman/pkgconfig) in its own cell so the chain/clang
        # cells don't each rebuild them; chain/clang/others are fully independent (the
        # compilers don't need the foundation in INSTALL_PREFIX to build). darwin cells are
        # skipped on PRs via the step-level gate below (matrix exclude can't read
        # github.event_name).
    steps:
      - name: Skip darwin on PRs
        id: gate
        run: |
          if [ "${{ matrix.host }}" = darwin ] && [ "${{ github.event_name }}" = pull_request ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "darwin cells are not built on PRs — skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # The prep image already contains the repo at /opt/msys-cross with prep outputs. Use it
      # as the working tree so build/ and deps/ from the image are present.
      - name: Enter prep workspace
        if: steps.gate.outputs.skip != 'true'
        run: echo "WS=/opt/msys-cross" >> "$GITHUB_ENV"

      - name: Set up sccache
        if: steps.gate.outputs.skip != 'true'
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: "v0.10.0"

      - name: Configure sccache (S3 backend)
        if: steps.gate.outputs.skip != 'true'
        env:
          SCCACHE_BUCKET: ${{ secrets.SCCACHE_S3_BUCKET }}
          SCCACHE_ENDPOINT: ${{ secrets.SCCACHE_S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_S3_SECRET }}
        run: |
          {
            echo "SCCACHE_PATH=${SCCACHE_PATH}"
            echo "SCCACHE_REGION=auto"
            echo "SCCACHE_S3_USE_SSL=true"
            echo "SCCACHE_S3_KEY_PREFIX=msys2-cross"
            echo "SCCACHE_IDLE_TIMEOUT=0"
            echo "SCCACHE_BUCKET=${SCCACHE_BUCKET}"
            echo "SCCACHE_ENDPOINT=${SCCACHE_ENDPOINT}"
            echo "AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}"
            echo "AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}"
          } >> "$GITHUB_ENV"
          if [ -z "${SCCACHE_BUCKET}" ]; then
            echo "::warning::SCCACHE_S3_* secrets absent — sccache will run with no backend (every compile a miss)."
          fi

      # clang is built once per host (BUILD_CLANG=true both); the chain phases build their
      # one target's binutils→gcc. The prep image's repo tree already has Steps 0-3 done.
      - name: Build cell (${{ matrix.host }} ${{ matrix.phase }})
        if: steps.gate.outputs.skip != 'true'
        working-directory: /opt/msys-cross
        run: bash scripts/build.sh ${{ matrix.host }} ${{ matrix.phase }}

      - name: sccache stats
        if: ${{ always() && steps.gate.outputs.skip != 'true' }}
        run: "${SCCACHE_PATH:-sccache} --show-stats || true"

      # Each cell uploads its produced packages. PKGDEST is repo/ (linux) or repo-darwin/
      # (darwin); the artifact name is unique per (host, phase) so the collect job can grab
      # them all. A sanitized phase (": " → "-") keeps the artifact name valid.
      - name: Compute artifact name
        if: steps.gate.outputs.skip != 'true'
        id: art
        run: |
          ph="$(echo '${{ matrix.phase }}' | tr ':' '-')"
          echo "name=pkgs-${{ matrix.host }}-${ph}" >> "$GITHUB_OUTPUT"
          if [ "${{ matrix.host }}" = darwin ]; then
            echo "dir=repo-darwin" >> "$GITHUB_OUTPUT"
          else
            echo "dir=repo" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload cell packages
        if: steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.art.outputs.name }}
          path: /opt/msys-cross/${{ steps.art.outputs.dir }}/*.pkg.tar.*
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Collect (linux): gather all linux cells' packages → repo-add + installer → release.
  # ---------------------------------------------------------------------------
  collect-linux:
    needs: [build-prep-image, cell]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ${{ needs.build-prep-image.outputs.image }}
    steps:
      - name: Download all linux cell packages
        uses: actions/download-artifact@v5
        with:
          pattern: pkgs-linux-*
          path: /tmp/pkgs
          merge-multiple: true

      - name: Stage packages into repo/
        working-directory: /opt/msys-cross
        run: |
          mkdir -p repo
          cp -v /tmp/pkgs/*.pkg.tar.* repo/ 2>/dev/null || true
          ls -lh repo/*.pkg.tar.* | head -50

      - name: Assemble repo db + installer
        working-directory: /opt/msys-cross
        run: bash scripts/build.sh linux assemble

      - name: Summarize repo
        working-directory: /opt/msys-cross
        run: |
          echo "=== Packages ==="; ls -lh repo/*.pkg.tar.* 2>/dev/null || true
          echo "=== Database ==="; ls -lh repo/msys-cross.db* repo/msys-cross.files* 2>/dev/null || true
          echo "=== Bootstrap ==="; ls -lh repo/bootstrap.tar.xz 2>/dev/null || true

      - name: Upload pacman repo
        uses: actions/upload-artifact@v7
        with:
          name: msys-cross-repo
          path: |
            /opt/msys-cross/repo/*.pkg.tar.*
            /opt/msys-cross/repo/msys-cross.db*
            /opt/msys-cross/repo/msys-cross.files*
          if-no-files-found: error
          retention-days: 14

      - name: Upload bootstrap tarball
        uses: actions/upload-artifact@v7
        with:
          name: msys-cross-bootstrap
          path: /opt/msys-cross/repo/bootstrap.tar.xz
          if-no-files-found: error
          retention-days: 14

      - name: Publish release
        if: github.event_name == 'push'
        working-directory: /opt/msys-cross
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          date_tag="$(date -u +%Y%m%d)"
          n="$(gh release list --limit 200 --json tagName \
                 --jq "[.[] | select(.tagName | startswith(\"build-${date_tag}.\"))] | length" \
               2>/dev/null || echo 0)"
          tag="build-${date_tag}.$((n + 1))"
          echo "Release tag: $tag"
          assets=()
          for f in repo/*.pkg.tar.* repo/msys-cross.db.tar.gz repo/msys-cross.files.tar.gz repo/bootstrap.tar.xz; do
            [ -f "$f" ] && assets+=("$f")
          done
          echo "Uploading ${#assets[@]} assets"
          gh release create "$tag" "${assets[@]}" \
            --title "$tag" \
            --notes "Automated build from ${GITHUB_SHA}. Consumed by msys-mirror; pin via /archive/${tag}/." \
            --target "${GITHUB_SHA}"

  # ---------------------------------------------------------------------------
  # Collect (darwin): same, for the arm64-macOS-host repo. Skipped on PRs.
  # ---------------------------------------------------------------------------
  collect-darwin:
    needs: [build-prep-image, cell]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ${{ needs.build-prep-image.outputs.image }}
    steps:
      - name: Download all darwin cell packages
        uses: actions/download-artifact@v5
        with:
          pattern: pkgs-darwin-*
          path: /tmp/pkgs
          merge-multiple: true

      - name: Stage packages into repo-darwin/
        working-directory: /opt/msys-cross
        run: |
          mkdir -p repo-darwin
          cp -v /tmp/pkgs/*.pkg.tar.* repo-darwin/ 2>/dev/null || true
          ls -lh repo-darwin/*.pkg.tar.* | head -50

      - name: Assemble repo db + installer
        working-directory: /opt/msys-cross
        run: bash scripts/build.sh darwin assemble

      - name: Summarize darwin repo
        working-directory: /opt/msys-cross
        run: |
          echo "=== Darwin packages ==="; ls -lh repo-darwin/*.pkg.tar.* 2>/dev/null || true
          echo "=== Darwin database ==="; ls -lh repo-darwin/msys-cross-darwin.db* 2>/dev/null || true

      - name: Upload darwin pacman repo
        uses: actions/upload-artifact@v7
        with:
          name: msys-cross-darwin-repo
          path: |
            /opt/msys-cross/repo-darwin/*.pkg.tar.*
            /opt/msys-cross/repo-darwin/msys-cross-darwin.db*
            /opt/msys-cross/repo-darwin/msys-cross-darwin.files*
            /opt/msys-cross/repo-darwin/bootstrap-darwin.tar.xz
          if-no-files-found: error
          retention-days: 14

      - name: Publish darwin release
        if: github.event_name == 'push'
        working-directory: /opt/msys-cross
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          date_tag="$(date -u +%Y%m%d)"
          n="$(gh release list --limit 200 --json tagName \
                 --jq "[.[] | select(.tagName | startswith(\"build-darwin-${date_tag}.\"))] | length" \
               2>/dev/null || echo 0)"
          tag="build-darwin-${date_tag}.$((n + 1))"
          echo "Release tag: $tag"
          assets=()
          for f in repo-darwin/*.pkg.tar.* repo-darwin/msys-cross-darwin.db.tar.gz repo-darwin/msys-cross-darwin.files.tar.gz repo-darwin/bootstrap-darwin.tar.xz; do
            [ -f "$f" ] && assets+=("$f")
          done
          echo "Uploading ${#assets[@]} assets"
          gh release create "$tag" "${assets[@]}" \
            --title "$tag" \
            --notes "Automated darwin (arm64 macOS host) build from ${GITHUB_SHA}." \
            --target "${GITHUB_SHA}"
