# Build the full msys2-cross toolchain repo on GitHub Actions — single-client topology.
#
# Steps 0-2 (host tools, zig, MSYS2 sysroots + wine helpers) are baked ONCE into a prep
# container image (build-prep-image job → ghcr; buildx gha layer cache keeps unchanged
# rebuilds fast). The `build` job runs that image and builds everything in ONE container:
# Step 3 static deps, then per host (linux x86_64, then darwin arm64-macOS on push) the
# binutils→gcc chains for mingw64/mingw32/ucrt64/cygwin + clang, then repo-add + installer,
# then publishes the GitHub Release. Compiles run locally with sccache caching to the shared
# external SeaweedFS S3 bucket, so runs share one hot cache.
#
# History: this replaced a 12-cell parallel topology, and briefly an sccache-dist farm
# (15 workers). The farm was removed — distributing this toolchain build proved unreliable
# (see docs/superpowers/specs/2026-06-10-farm-debugging-findings.md). The S3 cache + single
# container (the valuable parts) are kept.
name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write   # push the prep image to ghcr

env:
  PREP_IMAGE: ghcr.io/${{ github.repository_owner }}/msys2-cross-prep

jobs:
  # ---------------------------------------------------------------------------
  # Prep image: Steps 0-3 for BOTH hosts, baked into one image and pushed to ghcr.
  # buildx layer cache (type=gha) makes an unchanged rebuild near-instant; a change to
  # build_deps.sh / sysroot scripts only re-runs the affected layer.
  # ---------------------------------------------------------------------------
  build-prep-image:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # Tag the prep image by the triggering commit's short SHA, so the image is rebuilt every
      # run from THIS commit's checkout context (Dockerfile's `COPY . .` bakes the current
      # source + submodules). That keeps the baked /opt/msys-cross tree in lock-step with the
      # commit under test — the cells build the right source without any in-container re-sync.
      # buildx's gha layer cache keeps the heavy prep layers (linux deps from source) fast, so
      # a rebuild that changes only source is cheap (the deps layers are cache hits).
      - name: Compute image tag
        id: meta
        run: |
          tag="sha-${GITHUB_SHA::12}"
          echo "image=${PREP_IMAGE}:${tag}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Prep image tag: ${tag}"

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build + push the prep image every run. The Dockerfile builds the linux deps from
      # source (the heavy bit) and fetches darwin bottles; buildx gha cache makes an unchanged
      # rebuild fast (only layers whose inputs changed re-run). sccache is NOT used here — prep
      # compiles only the small static deps via zig directly.
      - name: Build and push prep image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prep
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Build (single client container): builds ALL linux phases, assembles + releases,
  # then on push builds darwin back-to-back. Compiles run LOCALLY in this container
  # with sccache caching to S3 (cross-run reuse). The sccache-dist farm was removed:
  # distributing this toolchain build proved unreliable (zig c++ dist compiles lose
  # libc++ headers, clang mangles the -target triple, ~9% dist failures broke the gcc
  # chains) and net-slower (per-TU round-trips dominate). The valuable parts of the
  # migration — one client container + the S3 compile cache — are kept. See
  # docs/superpowers/specs/2026-06-10-farm-debugging-findings.md for the evidence and
  # the option to revisit dist if the fork is fixed.
  # ---------------------------------------------------------------------------
  build:
    needs: build-prep-image
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: ${{ needs.build-prep-image.outputs.image }}
    steps:
      # Install sccache (stock mozilla build — no dist needed now; it does local compile +
      # S3 cache). The dist-action used to provide the forked sccache on PATH; with the farm
      # gone, install it explicitly. Sets SCCACHE_PATH.
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: "v0.10.0"

      # Configure sccache (local compile + S3 cache; no distribution — farm removed).
      # MAKEFLAGS uses the container's own core count. The S3 vars are also written into
      # builduser's config file in the next step; setting them here too is harmless.
      - name: Configure sccache S3 cache + local -j
        env:
          SCCACHE_BUCKET: ${{ secrets.SCCACHE_S3_BUCKET }}
          SCCACHE_ENDPOINT: ${{ secrets.SCCACHE_S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_S3_SECRET }}
        run: |
          {
            echo "SCCACHE_REGION=auto"
            echo "SCCACHE_S3_USE_SSL=true"
            echo "SCCACHE_S3_KEY_PREFIX=msys2-cross"
            echo "SCCACHE_IDLE_TIMEOUT=0"
            echo "SCCACHE_BUCKET=${SCCACHE_BUCKET}"
            echo "SCCACHE_ENDPOINT=${SCCACHE_ENDPOINT}"
            echo "AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}"
            echo "AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}"
            echo "MAKEFLAGS=-j$(nproc)"
          } >> "$GITHUB_ENV"
          if [ -z "${SCCACHE_BUCKET}" ]; then
            echo "::warning::SCCACHE_S3_* secrets absent — sccache S3 cache disabled (local-disk only)."
          fi
          echo "Local build: MAKEFLAGS=-j$(nproc)  (farm/dist disabled)"

      # The build compiles run as `builduser` (makepkg/build_deps refuse root). builduser needs
      # a writable sccache cache dir and an S3-backed sccache config. Earlier failures:
      # (a) builduser couldn't write root's default cache dir ("failed to create directory
      # …/preprocessor: Permission denied" -> no object -> configure "no working compiler");
      # (b) selecting S3 via env didn't reliably reach the daemon. Fix: (1) a builduser-owned
      # SCCACHE_DIR (overridden for all steps); (2) select S3 via the sccache CONFIG FILE
      # ([cache.s3], read deterministically by the daemon); AWS creds from env (sccache's only
      # source), exported for the auto-started daemon. No [dist] section -> compiles run locally.
      - name: Make sccache usable by builduser (writable cache + S3 backend via config file)
        env:
          SCCACHE_BUCKET: ${{ secrets.SCCACHE_S3_BUCKET }}
          SCCACHE_ENDPOINT: ${{ secrets.SCCACHE_S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_S3_SECRET }}
        run: |
          set -euo pipefail
          BU_HOME="$(getent passwd builduser | cut -d: -f6)"; BU_HOME="${BU_HOME:-/home/builduser}"
          # 1) builduser-owned cache dir (local fallback / preprocessor scratch).
          SCC_DIR=/opt/msys-cross/.sccache-cache
          mkdir -p "$SCC_DIR"; chown -R builduser:builduser "$SCC_DIR"
          echo "SCCACHE_DIR=${SCC_DIR}" >> "$GITHUB_ENV"
          # 2) Build builduser's sccache config: S3 backend ([cache.s3], from file = robust). The
          #    daemon reads this file deterministically at start; AWS creds ride the env (the only
          #    source sccache reads them from). If S3 secrets are absent, omit [cache.s3] -> disk.
          install -d -o builduser -g builduser "$BU_HOME/.config/sccache"
          cfg="$BU_HOME/.config/sccache/config"; : > "$cfg"
          if [ -n "${SCCACHE_BUCKET}" ]; then
            {
              echo "[cache.s3]"
              echo "bucket = \"${SCCACHE_BUCKET}\""
              echo "endpoint = \"${SCCACHE_ENDPOINT}\""
              echo "region = \"auto\""
              echo "key_prefix = \"msys2-cross\""
              echo "use_ssl = true"
              echo "no_credentials = false"
            } >> "$cfg"
            # Creds for the daemon (env-only in sccache); export for all later builduser steps.
            {
              echo "AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}"
              echo "AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::SCCACHE_S3_* secrets absent — sccache will use local-disk cache only."
          fi
          # NOTE: distribution (the [dist] section) is intentionally NOT appended. The
          # sccache-dist farm proved unreliable for this toolchain build — distributed
          # compiles failed in multiple ways (verified across runs 27214110825 / 27219990154):
          #   * zig c++ dist compiles can't find libc++ headers ('memory' file not found in
          #     libcody/buffer.cc) — works locally, breaks only when distributed;
          #   * clang normalizes the wrapper's valid -target x86_64-linux-gnu.2.11 to
          #     x86_64-unknown-linux-gnu.2.11, which zig then rejects;
          #   * ~9% of distributed compiles failed outright, breaking the gcc chains.
          # So compile LOCALLY (in this one container) with sccache caching to S3 — the
          # genuinely valuable parts (single client + cross-run cache) without the fragile
          # farm. See docs/superpowers/specs/2026-06-10-farm-debugging-findings.md.
          echo "distribution disabled — compiling locally with sccache (S3 cache); farm not used"
          chown builduser:builduser "$cfg"
          echo "=== builduser sccache config ($cfg) ==="
          sed 's/token = .*/token = ***/; s/AWS.*=.*/&/' "$cfg"
          # sccache binary: SCCACHE_PATH (set by the install step) or whatever is on PATH.
          # builduser must be able to execute it — the tool-cache path is world-readable, but
          # guard anyway.
          SCC="${SCCACHE_PATH:-}"; [ -n "$SCC" ] || SCC="$(command -v sccache 2>/dev/null || true)"
          if [ -z "$SCC" ]; then echo "::warning::sccache not found on PATH/SCCACHE_PATH"; fi
          # Make SCCACHE_PATH visible to all later builduser steps (the zigcc wrapper prefers it).
          [ -n "$SCC" ] && echo "SCCACHE_PATH=${SCC}" >> "$GITHUB_ENV"
          # Sanity: start the daemon as builduser and confirm the backend (best-effort; the S3
          # stats round-trip can be slow, so cap it and never fail the step here).
          if [ -n "$SCC" ]; then
            runuser -w PATH -u builduser -- env PATH="$PATH" SCCACHE_DIR="$SCC_DIR" \
              AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID:-}" AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY:-}" \
              "$SCC" --start-server >/dev/null 2>&1 || true
            timeout 30 runuser -w PATH -u builduser -- env PATH="$PATH" SCCACHE_DIR="$SCC_DIR" \
              "$SCC" --show-stats 2>&1 | grep -iE "Cache location" || echo "(backend check timed out / skipped)"
          fi

      # Quick sanity: a builduser compile through the wrapper must produce an object (the
      # original failure was "no working compiler"). Non-fatal (set +e) so it never blocks.
      - name: Sanity — builduser zigcc compile produces an object
        working-directory: /opt/msys-cross
        run: |
          set +e
          export SCRIPTS_DIR=/opt/msys-cross/scripts PROJECT_ROOT=/opt/msys-cross
          . scripts/env-linux.sh
          . scripts/build-common.sh
          . scripts/msys-cross-common.sh && setup_zig_env
          printf 'int main(void){return 0;}\n' > /tmp/conftest.c; chmod 666 /tmp/conftest.c
          run_as_builduser "$CC" -O2 -fPIC -c /tmp/conftest.c -o /tmp/conftest.bu.o
          echo "builduser compile rc=$?  object: $([ -f /tmp/conftest.bu.o ] && echo YES || echo NO)"

      # Static deps (Step 3) run here, NOT in the prep image, so the zigcc-routed linux
      # deps compile (gmp/mpfr/mpc/isl/zlib/zstd) distributes across the farm. darwin's
      # deps are just Homebrew-bottle curls (no compile) but use the same phase.
      - name: Build linux deps (local sccache)
        working-directory: /opt/msys-cross
        run: bash scripts/build.sh linux deps

      - name: Build linux phases (local sccache)
        working-directory: /opt/msys-cross
        run: |
          set -euo pipefail
          for ph in others chain:mingw64 chain:mingw32 chain:ucrt64 chain:cygwin clang; do
            echo "::group::build linux $ph"
            bash scripts/build.sh linux "$ph"
            echo "::endgroup::"
          done

      - name: sccache stats (linux)
        if: always()
        run: "${SCCACHE_PATH:-sccache} --show-stats || true"

      - name: Assemble linux repo db + installer
        working-directory: /opt/msys-cross
        run: bash scripts/build.sh linux assemble

      - name: Summarize linux repo
        working-directory: /opt/msys-cross
        run: |
          echo "=== Packages ==="; ls -lh repo/*.pkg.tar.* 2>/dev/null || true
          echo "=== Database ==="; ls -lh repo/msys-cross.db* repo/msys-cross.files* 2>/dev/null || true
          echo "=== Bootstrap ==="; ls -lh repo/bootstrap.tar.xz 2>/dev/null || true

      - name: Upload linux pacman repo
        uses: actions/upload-artifact@v7
        with:
          name: msys-cross-repo
          path: |
            /opt/msys-cross/repo/*.pkg.tar.*
            /opt/msys-cross/repo/msys-cross.db*
            /opt/msys-cross/repo/msys-cross.files*
          if-no-files-found: error
          retention-days: 14

      - name: Upload linux bootstrap tarball
        uses: actions/upload-artifact@v7
        with:
          name: msys-cross-bootstrap
          path: /opt/msys-cross/repo/bootstrap.tar.xz
          if-no-files-found: error
          retention-days: 14

      - name: Publish linux release
        if: github.event_name == 'push'
        working-directory: /opt/msys-cross
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          date_tag="$(date -u +%Y%m%d)"
          n="$(gh release list --limit 200 --json tagName \
                 --jq "[.[] | select(.tagName | startswith(\"build-${date_tag}.\"))] | length" \
               2>/dev/null || echo 0)"
          tag="build-${date_tag}.$((n + 1))"
          echo "Release tag: $tag"
          assets=()
          for f in repo/*.pkg.tar.* repo/msys-cross.db.tar.gz repo/msys-cross.files.tar.gz repo/bootstrap.tar.xz; do
            [ -f "$f" ] && assets+=("$f")
          done
          echo "Uploading ${#assets[@]} assets"
          gh release create "$tag" "${assets[@]}" \
            --title "$tag" \
            --notes "Automated build from ${GITHUB_SHA}. Consumed by msys-mirror; pin via /archive/${tag}/." \
            --target "${GITHUB_SHA}"

      # ---- darwin: push-only, back-to-back in the SAME coordinator container ----
      # darwin deps = Homebrew-bottle curls (no compile); still its own phase for symmetry.
      - name: Build darwin deps
        if: github.event_name == 'push'
        working-directory: /opt/msys-cross
        run: bash scripts/build.sh darwin deps

      - name: Build darwin phases (local sccache)
        if: github.event_name == 'push'
        working-directory: /opt/msys-cross
        run: |
          set -euo pipefail
          for ph in others chain:mingw64 chain:mingw32 chain:ucrt64 chain:cygwin clang; do
            echo "::group::build darwin $ph"
            bash scripts/build.sh darwin "$ph"
            echo "::endgroup::"
          done

      - name: sccache stats (darwin)
        if: ${{ always() && github.event_name == 'push' }}
        run: "${SCCACHE_PATH:-sccache} --show-stats || true"

      - name: Assemble darwin repo db + installer
        if: github.event_name == 'push'
        working-directory: /opt/msys-cross
        run: bash scripts/build.sh darwin assemble

      - name: Upload darwin pacman repo
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: msys-cross-darwin-repo
          path: |
            /opt/msys-cross/repo-darwin/*.pkg.tar.*
            /opt/msys-cross/repo-darwin/msys-cross-darwin.db*
            /opt/msys-cross/repo-darwin/msys-cross-darwin.files*
            /opt/msys-cross/repo-darwin/bootstrap-darwin.tar.xz
          if-no-files-found: error
          retention-days: 14

      - name: Publish darwin release
        if: github.event_name == 'push'
        working-directory: /opt/msys-cross
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          date_tag="$(date -u +%Y%m%d)"
          n="$(gh release list --limit 200 --json tagName \
                 --jq "[.[] | select(.tagName | startswith(\"build-darwin-${date_tag}.\"))] | length" \
               2>/dev/null || echo 0)"
          tag="build-darwin-${date_tag}.$((n + 1))"
          echo "Release tag: $tag"
          assets=()
          for f in repo-darwin/*.pkg.tar.* repo-darwin/msys-cross-darwin.db.tar.gz repo-darwin/msys-cross-darwin.files.tar.gz repo-darwin/bootstrap-darwin.tar.xz; do
            [ -f "$f" ] && assets+=("$f")
          done
          echo "Uploading ${#assets[@]} assets"
          gh release create "$tag" "${assets[@]}" \
            --title "$tag" \
            --notes "Automated darwin (arm64 macOS host) build from ${GITHUB_SHA}." \
            --target "${GITHUB_SHA}"
