# msys-cross clangarm64 cross-compile config (aarch64 Windows, UCRT).
# Same shape as clang64.cfg; only the target triple + sysroot subdir differ.
--target=aarch64-w64-windows-gnu
--sysroot=<CFGDIR>/../../clangarm64
-fuse-ld=lld
-rtlib=compiler-rt
-stdlib=libc++
-unwindlib=libunwind
-isystem <CFGDIR>/../../clangarm64/include/c++/v1
-isystem <CFGDIR>/../../clangarm64/include
-idirafter <CFGDIR>/../../libexec/msys-cross-clang/lib/clang/22/include
-L <CFGDIR>/../../clangarm64/lib
-lc++
-lunwind
-Wno-unused-command-line-argument
