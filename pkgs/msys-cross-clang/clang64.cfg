# msys-cross clang64 cross-compile config (x86_64 Windows, UCRT).
# <CFGDIR> = the dir of this file (<prefix>/etc/clang) at runtime.
# The official compiler-rt -resource-dir is injected by the wrapper (runtime glob);
# this file carries only the stable, path-relative flags.
--target=x86_64-w64-windows-gnu
--sysroot=<CFGDIR>/../../clang64
-fuse-ld=lld
-rtlib=compiler-rt
-stdlib=libc++
-unwindlib=libunwind
-isystem <CFGDIR>/../../clang64/include/c++/v1
-isystem <CFGDIR>/../../clang64/include
# Our own clang's intrinsics headers (mm_malloc.h, immintrin.h, ...) as a fallback —
# the official clang64 compiler-rt package's resource dir does not ship them.
-idirafter <CFGDIR>/../../libexec/msys-cross-clang/lib/clang/22/include
-L <CFGDIR>/../../clang64/lib
# mingw clang does not auto-link libc++; add the C++ runtime explicitly.
-lc++
-lunwind
-Wno-unused-command-line-argument
