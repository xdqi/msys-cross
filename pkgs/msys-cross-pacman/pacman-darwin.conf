[options]
# Host = arm64 macOS. This pacman runs on Apple Silicon and installs the
# msys-cross-darwin cross-toolchain (arm64 Mach-O binaries) plus, optionally,
# MSYS2 target runtime packages for development.
Architecture = arm64
NoExtract = *.exe
SigLevel = Never
DisableDownloadTimeout

# The arm64-macOS-host toolchain repo (served by msys-mirror from the
# build-darwin-* releases). Distinct db (msys-cross-darwin) and path (/repo-darwin)
# from the linux x86_64 [msys-cross] repo.
[msys-cross-darwin]
Server = https://msys.kosaka.moe/repo-darwin
SigLevel = Never

# Upstream MSYS2 target runtime/library repos (Windows/msys target packages — the
# same ones the linux config uses; useful for `pacman -S`'ing extra mingw/msys libs
# to develop against). The toolchain packages already bundle the runtime they need,
# so these are optional.
[mingw64]
Server = https://repo.msys2.org/mingw/mingw64/
SigLevel = Never

[mingw32]
Server = https://repo.msys2.org/mingw/mingw32/
SigLevel = Never

[ucrt64]
Server = https://repo.msys2.org/mingw/ucrt64/
SigLevel = Never

[clang64]
Server = https://repo.msys2.org/mingw/clang64/
SigLevel = Never

[clangarm64]
Server = https://repo.msys2.org/mingw/clangarm64/
SigLevel = Never

[msys]
Server = https://repo.msys2.org/msys/x86_64/
SigLevel = Never
